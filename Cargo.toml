[package]
name = "nana"
version = "0.1.0"
edition = "2021"
description = "An adaptive terminal editor: every language, one sober ui"
license = "MIT"
repository = "https://github.com/mitige/nana"
readme = "README.md"
keywords = ["editor", "tui", "terminal", "nano", "ratatui"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "nana"
path = "src/bin/nana.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-onig", "plist-load"] }
fuzzy-matcher = "0.3"
unicode-width = "0.2"
portable-pty = "0.8"
vt100 = "0.15"
ureq = { version = "3", features = ["json"] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true