name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo build --release
      - name: package
        run: |
          mkdir dist
          cp target/release/nana dist/
          tar -czf nana-linux-x86_64.tar.gz -C dist nana
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: nana-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo build --release
      - name: package
        shell: pwsh
        run: Compress-Archive -Path target/release/nana.exe -DestinationPath nana-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: nana-windows-x86_64.zip

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" nana-linux-x86_64.tar.gz nana-windows-x86_64.zip --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
